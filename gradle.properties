android.useAndroidX=true
android.enableJetifier=false

# Build performance — parallel project builds + build cache (safe, local + CI).
org.gradle.parallel=true
org.gradle.caching=true

# Shared desktop release token — keep in sync with desktop.DesktopVersion.VERSION / FALLBACK
desktopVersion=1.4e

# compileSdk 36 (Android 16) is required for Play's 2026 target-API rule. AGP 8.7
# was only tested up to 35 and prints a warning; silence it until AGP is bumped.
android.suppressUnsupportedCompileSdk=36
