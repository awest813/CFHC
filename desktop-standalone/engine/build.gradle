plugins {
    id 'java-library'
}

def repoRoot = rootProject.projectDir.parentFile

def desktopVersion = '1.4e'
def desktopVersionProps = new File(repoRoot, 'gradle.properties')
if (desktopVersionProps.file) {
    def loaded = new Properties()
    desktopVersionProps.withInputStream { loaded.load(it) }
    def fromFile = loaded.getProperty('desktopVersion')
    if (fromFile != null && !fromFile.trim().isEmpty()) {
        desktopVersion = fromFile.trim()
    }
}
if (findProperty('desktopVersion')) {
    desktopVersion = findProperty('desktopVersion').toString()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

/** Same package filters as root {@code compileDesktopJava}. */
sourceSets {
    main {
        java {
            srcDir "${repoRoot}/src/main/java"
            include 'comparator/**'
            include 'desktop/**'
            include 'positions/**'
            include 'recruiting/**'
            include 'simulation/**'
            include 'staff/**'
        }
    }
    test {
        java {
            srcDir "${repoRoot}/src/test/java"
            include 'comparator/**'
            include 'desktop/**'
            include 'recruiting/**'
            include 'simulation/**'
        }
    }
}

dependencies {
    implementation fileTree("${repoRoot}/libs").matching {
        include 'flatlaf*.jar'
    }
    testImplementation 'junit:junit:4.13.2'
    // OGG/MP3 decode for DesktopAudioManager tests / headless smoke parity with desktopJar
    testRuntimeOnly fileTree("${repoRoot}/libs").matching {
        include 'vorbisspi*.jar'
        include 'jorbis*.jar'
        include 'tritonus-share*.jar'
        include 'mp3spi*.jar'
        include 'jlayer*.jar'
    }
}

/** Must match {@code desktop.DesktopResourceContract.VALUE_XML_FILES} / root build.gradle. */
def desktopValueXmlFiles = [
        'strings.xml',
        'first_names.xml',
        'last_names.xml',
        'conferences.xml',
        'teams.xml',
        'bowls.xml',
]

tasks.register('verifyDesktopResources') {
    group = 'verification'
    description = 'Ensures res/values XML and assets exist for DesktopResourceProvider.'
    doLast {
        desktopValueXmlFiles.each { name ->
            def f = file("${repoRoot}/src/main/res/values/${name}")
            if (!f.file) {
                throw new GradleException("Missing desktop resource file (sync with DesktopResourceContract): ${f}")
            }
        }
        def assetsDir = file("${repoRoot}/src/main/assets")
        if (!assetsDir.directory) {
            throw new GradleException('Missing src/main/assets (desktop needs asset streams).')
        }
    }
}

tasks.register('checkEngineImports') {
    group = 'verification'
    description = 'Fails if engine packages import Android/UI APIs.'
    doLast {
        def forbidden = ~/^\s*import\s+(static\s+)?(android\.|androidx\.|antdroid\.)/
        def violations = []
        ['comparator', 'positions', 'simulation', 'staff'].each { pkg ->
            fileTree("${repoRoot}/src/main/java/${pkg}").matching {
                include '**/*.java'
            }.each { f ->
                int num = 0
                f.eachLine { line ->
                    num++
                    if (line.find(forbidden)) {
                        violations << "${f.path}:${num}: ${line.trim()}"
                    }
                }
            }
        }
        fileTree("${repoRoot}/src/main/java/recruiting").matching {
            include '**/*.java'
        }.each { f ->
            int num = 0
            f.eachLine { line ->
                num++
                if (line.find(forbidden)) {
                    violations << "${f.path}:${num}: ${line.trim()}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                    'Engine packages must not import Android/UI APIs:\n' + violations.join('\n'))
        }
    }
}

def desktopVersionPropsDir = layout.buildDirectory.dir('generated/desktop-version')

tasks.register('writeDesktopVersionProperties') {
    group = 'desktop'
    description = 'Writes desktop-version.properties for DesktopVersion / packaging.'
    def outFile = desktopVersionPropsDir.map { it.file('desktop-version.properties') }
    outputs.file(outFile)
    inputs.property('desktopVersion', desktopVersion)
    doLast {
        def f = outFile.get().asFile
        f.parentFile.mkdirs()
        f.text = "version=${desktopVersion}\n"
    }
}

tasks.named('compileJava') {
    dependsOn verifyDesktopResources, checkEngineImports, writeDesktopVersionProperties
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-Xlint:deprecation')
}

def desktopResourcesDir = layout.buildDirectory.dir('desktop-resources')

tasks.register('verifySoundtrackResources') {
    group = 'verification'
    description = 'Validates the soundtrack audio (Pixabay MP3 theme + march OGGs).'
    def soundtrackDir = file("${repoRoot}/desktop-assets/soundtrack")
    doLast {
        if (!soundtrackDir.directory) {
            throw new GradleException("Missing ${soundtrackDir} (soundtrack audio).")
        }
        ['fight_song', 'offseason_calm', 'recruiting_groove'].each { name ->
            def f = new File(soundtrackDir, "${name}.ogg")
            if (!f.file) throw new GradleException("Missing soundtrack OGG: ${f}")
            def b = f.bytes
            if (b.length < 4 || b[0] != 0x4F as byte || b[1] != 0x67 as byte ||
                b[2] != 0x67 as byte || b[3] != 0x53 as byte) {
                throw new GradleException("Invalid OGG header in soundtrack: ${f.name}")
            }
        }
        def theme = new File(soundtrackDir, 'marching_band.mp3')
        if (!theme.file) throw new GradleException("Missing soundtrack MP3: ${theme}")
        def tb = theme.bytes
        // MP3: "ID3" tag or a raw MPEG frame sync (0xFF Ex).
        boolean id3 = tb.length > 3 && tb[0] == 0x49 as byte && tb[1] == 0x44 as byte && tb[2] == 0x33 as byte
        boolean frameSync = tb.length > 2 && (tb[0] & 0xFF) == 0xFF && (tb[1] & 0xE0) == 0xE0
        if (!id3 && !frameSync) {
            throw new GradleException('Invalid MP3 header in soundtrack: marching_band.mp3')
        }
        logger.lifecycle "Soundtrack OK — MP3 theme + 3 march OGGs validated"

        // Generated WAV SFX (original synthesized audio; the inherited OGG
        // set is mostly corrupt — desktop prefers these WAVs).
        def sfxDir = file("${repoRoot}/desktop-assets/sfx")
        if (!sfxDir.directory) {
            throw new GradleException("Missing ${sfxDir} (generated WAV SFX).")
        }
        ['advance', 'click', 'confirm', 'error', 'firstdown',
         'loss', 'play', 'ui_back', 'ui_toggle', 'whistle', 'win'].each { name ->
            def f = new File(sfxDir, "${name}.wav")
            if (!f.file) throw new GradleException("Missing SFX WAV: ${f}")
            def b = f.bytes
            if (b.length < 12 || b[0] != 0x52 as byte || b[1] != 0x49 as byte ||
                b[2] != 0x46 as byte || b[3] != 0x46 as byte ||   // "RIFF"
                b[8] != 0x57 as byte || b[9] != 0x41 as byte ||
                b[10] != 0x56 as byte || b[11] != 0x45 as byte) { // "WAVE"
                throw new GradleException("Invalid RIFF/WAVE header in SFX: ${f.name}")
            }
        }
        logger.lifecycle "SFX WAVs OK — 11 generated files validated"
    }
}

tasks.register('prepareDesktopResources', Copy) {
    group = 'desktop'
    dependsOn verifyDesktopResources, verifySoundtrackResources
    from("${repoRoot}/src/main/res/values") {
        include desktopValueXmlFiles
        into 'values'
    }
    from("${repoRoot}/src/main/assets") {
        into 'assets'
    }
    from("${repoRoot}/desktop-assets/soundtrack") {
        into 'assets/sounds/soundtrack'
    }
    from("${repoRoot}/desktop-assets/sfx") {
        into 'assets/sounds'
    }
    into desktopResourcesDir
}

/**
 * Merges the javax.sound SPI service files from the bundled audio jars.
 * vorbisspi and mp3spi each ship a META-INF/services file listing only their
 * own provider; with DuplicatesStrategy.EXCLUDE the fat jar would keep just
 * one and silently drop the other decoder's registration.
 */
def mergedSpiServicesDir = layout.buildDirectory.dir('merged-spi-services')

tasks.register('mergeSpiServices') {
    group = 'desktop'
    description = 'Merges javax.sound SPI service descriptors from the bundled audio jars.'
    def audioSpiJars = files(fileTree("${repoRoot}/libs").matching {
        include 'vorbisspi*.jar'
        include 'jorbis*.jar'
        include 'tritonus-share*.jar'
        include 'mp3spi*.jar'
        include 'jlayer*.jar'
    })
    inputs.files audioSpiJars
    outputs.dir mergedSpiServicesDir
    doLast {
        def outDir = mergedSpiServicesDir.get().asFile
        outDir.deleteDir()
        def byService = new TreeMap<String, LinkedHashSet<String>>()
        audioSpiJars.each { jarFile ->
            new java.util.zip.ZipFile(jarFile).withCloseable { zf ->
                zf.entries().findAll { entry ->
                    entry.name.startsWith('META-INF/services/javax.sound.sampled.spi.') && !entry.isDirectory()
                }.each { entry ->
                    def lines = zf.getInputStream(entry).text.readLines()
                            .findAll { it.trim() && !it.trim().startsWith('#') }
                            .collect { it.trim() }
                    byService.computeIfAbsent(entry.name) { new LinkedHashSet<String>() }.addAll(lines)
                }
            }
        }
        byService.each { name, lines ->
            def f = new File(outDir, name)
            f.parentFile.mkdirs()
            f.text = lines.join('\n') + '\n'
            logger.lifecycle "Merged SPI service ${name}: ${lines.size()} provider(s)"
        }
    }
}

/** Runnable fat-style jar (classes + resources + audio SPIs + FlatLaf). */
tasks.register('desktopJar', Jar) {
    group = 'desktop'
    dependsOn compileJava, prepareDesktopResources, writeDesktopVersionProperties, mergeSpiServices
    archiveBaseName = 'CFHC-desktop'
    archiveVersion = desktopVersion
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from desktopResourcesDir
    from(desktopVersionPropsDir)
    def bundledJars = fileTree("${repoRoot}/libs").matching {
        include 'vorbisspi*.jar'
        include 'jorbis*.jar'
        include 'tritonus-share*.jar'
        include 'mp3spi*.jar'
        include 'jlayer*.jar'
        include 'flatlaf*.jar'
    }
    bundledJars.each {
        from(zipTree(it)) {
            // SPI registrations come from mergeSpiServices instead — each
            // source jar lists only its own provider.
            exclude 'META-INF/services/javax.sound.sampled.spi.*'
        }
    }
    from(mergedSpiServicesDir)
    from("${repoRoot}") {
        include 'LICENSE'
        include 'SOUND_LICENSES.md'
    }
    manifest {
        attributes(
                'Main-Class': 'desktop.Main',
                'Implementation-Title': 'CFHC Desktop',
                'Implementation-Version': desktopVersion,
                'Implementation-Vendor': 'CFHC'
        )
    }
}

tasks.register('runDesktop', JavaExec) {
    group = 'desktop'
    dependsOn compileJava, prepareDesktopResources
    def oggSpiJars = files(fileTree("${repoRoot}/libs").matching {
        include 'vorbisspi*.jar'
        include 'jorbis*.jar'
        include 'tritonus-share*.jar'
        include 'mp3spi*.jar'
        include 'jlayer*.jar'
    })
    def flatlafJars = files(fileTree("${repoRoot}/libs").matching {
        include 'flatlaf*.jar'
    })
    classpath = sourceSets.main.runtimeClasspath + files(desktopResourcesDir.get().asFile) + oggSpiJars + flatlafJars
    mainClass = 'desktop.Main'
    if (project.hasProperty('desktopArgs')) {
        args project.property('desktopArgs').toString().split(/\s+/).findAll { !it.isEmpty() }
    }
}

tasks.named('jar') {
    enabled = false
}

tasks.named('test', Test) {
    // Tests use System.getProperty("user.dir") / DesktopResourceProvider(projectRoot) — must be repo root.
    workingDir = repoRoot
    // Forward -DregenGoldenSaves=true from the Gradle JVM into test workers.
    systemProperty 'regenGoldenSaves', System.getProperty('regenGoldenSaves', 'false')
    // DesktopAudioManager loads assets/sounds/* from the classpath (same layout as desktopJar).
    dependsOn prepareDesktopResources
    classpath += files(desktopResourcesDir)
    // Exclude long-running stress sims from the default gate; run on demand:
    //   ./gradlew -p desktop-standalone :engine:test --tests "simulation.Stress100SeasonsTest"
    filter {
        excludeTestsMatching '**/Stress100SeasonsTest*'
        excludeTestsMatching '**/Debug20SeasonsFlowTest*'
    }
}

tasks.register('desktopStandaloneGate') {
    group = 'verification'
    description = 'Compile shared engine, run JVM unit tests, build desktop jar — no Android SDK.'
    dependsOn test, desktopJar
    doLast {
        def jar = tasks.named('desktopJar', Jar).get().archiveFile.get().asFile
        def entries = new java.util.zip.ZipFile(jar).withCloseable { zf ->
            zf.entries().collect { it.name } as Set
        }
        def required = [
                'META-INF/services/javax.sound.sampled.spi.AudioFileReader',
                'javazoom/spi/vorbis/sampled/file/VorbisAudioFileReader.class',
                'javazoom/spi/mpeg/sampled/file/MpegAudioFileReader.class',
                'javazoom/jl/decoder/Bitstream.class',
                'com/jcraft/jorbis/VorbisFile.class',
                'org/tritonus/share/sampled/file/TAudioFileReader.class',
                'com/formdev/flatlaf/FlatLightLaf.class',
                'com/formdev/flatlaf/FlatDarkLaf.class',
                'LICENSE',
                'SOUND_LICENSES.md',
                'desktop/Main.class',
                'desktop/DesktopVersion.class',
                'desktop-version.properties',
                'assets/sounds/click.wav',
                'assets/sounds/win.wav',
                'assets/sounds/soundtrack/fight_song.ogg',
                'assets/sounds/soundtrack/marching_band.mp3',
        ]
        def missing = required.findAll { !entries.contains(it) }
        if (!missing.isEmpty()) {
            throw new GradleException('desktopJar missing required entries: ' + missing)
        }
        // The fat jar must register BOTH audio decoders — a first-wins
        // services file would silently break OGG or MP3 playback.
        def readerService = 'META-INF/services/javax.sound.sampled.spi.AudioFileReader'
        def needReaders = ['javazoom.spi.vorbis.sampled.file.VorbisAudioFileReader',
                           'javazoom.spi.mpeg.sampled.file.MpegAudioFileReader']
        new java.util.zip.ZipFile(jar).withCloseable { zf ->
            def providers = zf.getInputStream(zf.getEntry(readerService)).text.readLines()
                    .collect { it.trim() }
                    .findAll { it && !it.startsWith('#') }
            def missingReaders = needReaders.findAll { !providers.contains(it) }
            if (!missingReaders.isEmpty()) {
                throw new GradleException('AudioFileReader service missing providers: ' + missingReaders)
            }
        }
        def mf = new java.util.jar.JarFile(jar).withCloseable { it.manifest }
        def impl = mf?.mainAttributes?.getValue('Implementation-Version')
        if (impl != desktopVersion) {
            throw new GradleException("desktopJar Implementation-Version '${impl}' != desktopVersion '${desktopVersion}'")
        }
    }
}

def jpackageBinary = {
    def jp = new File(System.getProperty('java.home'), 'bin/jpackage')
    if (jp.exists()) {
        return jp
    }
    def jpExe = new File(System.getProperty('java.home'), 'bin/jpackage.exe')
    return jpExe.exists() ? jpExe : null
}

/**
 * Packaging scaffold for the desktop jar. Requires a JDK with {@code jpackage} (JDK 17+).
 * Not part of {@code desktopStandaloneGate}.
 * Signed macOS/Windows installers remain blocked on certificates.
 *
 * Note: {@code --type app-image} produces a jpackage application *directory*,
 * not a Linux {@code .AppImage} file.
 */
tasks.register('desktopJpackageDryRun') {
    group = 'desktop'
    description = 'Print the intended jpackage command for CFHC-desktop.'
    dependsOn desktopJar
    doLast {
        def jar = tasks.named('desktopJar', Jar).get().archiveFile.get().asFile
        def jpackage = jpackageBinary()
        println 'CFHC desktop packaging:'
        println '  input jar : ' + jar.absolutePath
        println '  main class: desktop.Main'
        println '  version   : ' + desktopVersion
        println '  suggested :'
        println '    jpackage --name CFHC --app-version ' + desktopVersion + ' --vendor CFHC' +
                ' --description "College Football Head Coach"' +
                ' --input ' + jar.parentFile.absolutePath +
                ' --main-jar ' + jar.name +
                ' --main-class desktop.Main --type app-image'
        if (jpackage == null) {
            println 'NOTE: jpackage binary not found in JAVA_HOME; install a full JDK 17+ to build installers.'
        } else {
            println 'jpackage available at: ' + jpackage.absolutePath
        }
    }
}

def fileAssociationsProps = file("${projectDir}/src/jpackage/cfhc-file-associations.properties")

tasks.register('desktopJpackageImage', Exec) {
    group = 'desktop'
    description = 'Build an unsigned jpackage app-image directory (not a .AppImage file).'
    dependsOn desktopJar
    onlyIf { jpackageBinary() != null }
    doFirst {
        def jar = tasks.named('desktopJar', Jar).get().archiveFile.get().asFile
        def outDir = layout.buildDirectory.dir('jpackage').get().asFile
        outDir.mkdirs()
        def existing = new File(outDir, 'CFHC')
        if (existing.exists()) {
            existing.deleteDir()
        }
        executable = jpackageBinary().absolutePath
        args = [
                '--name', 'CFHC',
                '--app-version', desktopVersion,
                '--vendor', 'CFHC',
                '--description', 'College Football Head Coach',
                '--input', jar.parentFile.absolutePath,
                '--main-jar', jar.name,
                '--main-class', 'desktop.Main',
                '--type', 'app-image',
                '--dest', outDir.absolutePath,
                '--file-associations', fileAssociationsProps.absolutePath
        ]
    }
}

/** Back-compat alias — same as {@link #desktopJpackageImage}. */
tasks.register('desktopAppImage') {
    group = 'desktop'
    description = 'Alias for desktopJpackageImage (jpackage app directory, not a .AppImage file).'
    dependsOn desktopJpackageImage
}

tasks.register('desktopPortableZip', Zip) {
    group = 'desktop'
    description = 'Zip the unsigned jpackage app-image directory into a portable archive (bundled runtime).'
    dependsOn desktopJpackageImage
    onlyIf { jpackageBinary() != null }
    archiveBaseName = 'CFHC-desktop-portable'
    archiveVersion = desktopVersion
    destinationDirectory = layout.buildDirectory.dir('dist')
    from(layout.buildDirectory.dir('jpackage/CFHC')) {
        into 'CFHC'
    }
    doFirst {
        def appDir = layout.buildDirectory.dir('jpackage/CFHC').get().asFile
        if (!appDir.directory) {
            throw new GradleException(
                    'Missing jpackage app-image at ' + appDir +
                            '. Run :engine:desktopJpackageImage first (requires JDK jpackage).')
        }
    }
}

tasks.register('desktopDmg', Exec) {
    group = 'desktop'
    description = 'Build an unsigned macOS .dmg via jpackage (macOS + jpackage only; unsigned).'
    dependsOn desktopJar
    onlyIf {
        def os = System.getProperty('os.name', '').toLowerCase()
        os.contains('mac') && jpackageBinary() != null
    }
    doFirst {
        def jar = tasks.named('desktopJar', Jar).get().archiveFile.get().asFile
        def outDir = layout.buildDirectory.dir('jpackage').get().asFile
        outDir.mkdirs()
        fileTree(outDir).matching { include 'CFHC*.dmg' }.files.each { it.delete() }
        executable = jpackageBinary().absolutePath
        args = [
                '--name', 'CFHC',
                '--app-version', desktopVersion,
                '--vendor', 'CFHC',
                '--description', 'College Football Head Coach',
                '--input', jar.parentFile.absolutePath,
                '--main-jar', jar.name,
                '--main-class', 'desktop.Main',
                '--type', 'dmg',
                '--dest', outDir.absolutePath,
                '--file-associations', fileAssociationsProps.absolutePath
        ]
    }
}

tasks.register('desktopMsi', Exec) {
    group = 'desktop'
    description = 'Build an unsigned Windows .msi via jpackage (Windows + jpackage only; unsigned).'
    dependsOn desktopJar
    onlyIf {
        def os = System.getProperty('os.name', '').toLowerCase()
        os.contains('win') && jpackageBinary() != null
    }
    doFirst {
        def jar = tasks.named('desktopJar', Jar).get().archiveFile.get().asFile
        def outDir = layout.buildDirectory.dir('jpackage').get().asFile
        outDir.mkdirs()
        fileTree(outDir).matching { include 'CFHC*.msi' }.files.each { it.delete() }
        executable = jpackageBinary().absolutePath
        args = [
                '--name', 'CFHC',
                '--app-version', desktopVersion,
                '--vendor', 'CFHC',
                '--description', 'College Football Head Coach',
                '--input', jar.parentFile.absolutePath,
                '--main-jar', jar.name,
                '--main-class', 'desktop.Main',
                '--type', 'msi',
                '--dest', outDir.absolutePath,
                '--file-associations', fileAssociationsProps.absolutePath
        ]
    }
}



