plugins {
    id 'java-library'
}

def repoRoot = rootProject.projectDir.parentFile

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

/** Same package filters as root {@code compileDesktopJava}. */
sourceSets {
    main {
        java {
            srcDir "${repoRoot}/src/main/java"
            include 'comparator/**'
            include 'desktop/**'
            include 'positions/**'
            include 'recruiting/**'
            include 'simulation/**'
            include 'staff/**'
        }
    }
    test {
        java {
            srcDir "${repoRoot}/src/test/java"
            include 'comparator/**'
            include 'desktop/**'
            include 'recruiting/**'
            include 'simulation/**'
        }
    }
}

dependencies {
    implementation fileTree("${repoRoot}/libs").matching {
        include 'flatlaf*.jar'
    }
    testImplementation 'junit:junit:4.13.2'
    // OGG decode for DesktopAudioManager tests / headless smoke parity with desktopJar
    testRuntimeOnly fileTree("${repoRoot}/libs").matching {
        include 'vorbisspi*.jar'
        include 'jorbis*.jar'
        include 'tritonus-share*.jar'
    }
}

/** Must match {@code desktop.DesktopResourceContract.VALUE_XML_FILES} / root build.gradle. */
def desktopValueXmlFiles = [
        'strings.xml',
        'first_names.xml',
        'last_names.xml',
        'conferences.xml',
        'teams.xml',
        'bowls.xml',
]

tasks.register('verifyDesktopResources') {
    group = 'verification'
    description = 'Ensures res/values XML and assets exist for DesktopResourceProvider.'
    doLast {
        desktopValueXmlFiles.each { name ->
            def f = file("${repoRoot}/src/main/res/values/${name}")
            if (!f.file) {
                throw new GradleException("Missing desktop resource file (sync with DesktopResourceContract): ${f}")
            }
        }
        def assetsDir = file("${repoRoot}/src/main/assets")
        if (!assetsDir.directory) {
            throw new GradleException('Missing src/main/assets (desktop needs asset streams).')
        }
    }
}

tasks.register('checkEngineImports') {
    group = 'verification'
    description = 'Fails if engine packages import Android/UI APIs.'
    doLast {
        def forbidden = ~/^\s*import\s+(static\s+)?(android\.|androidx\.|antdroid\.)/
        def violations = []
        ['comparator', 'positions', 'simulation', 'staff'].each { pkg ->
            fileTree("${repoRoot}/src/main/java/${pkg}").matching {
                include '**/*.java'
            }.each { f ->
                int num = 0
                f.eachLine { line ->
                    num++
                    if (line.find(forbidden)) {
                        violations << "${f.path}:${num}: ${line.trim()}"
                    }
                }
            }
        }
        fileTree("${repoRoot}/src/main/java/recruiting").matching {
            include '**/*.java'
        }.each { f ->
            int num = 0
            f.eachLine { line ->
                num++
                if (line.find(forbidden)) {
                    violations << "${f.path}:${num}: ${line.trim()}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                    'Engine packages must not import Android/UI APIs:\n' + violations.join('\n'))
        }
    }
}

tasks.named('compileJava') {
    dependsOn verifyDesktopResources, checkEngineImports
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-Xlint:deprecation')
}

def desktopResourcesDir = layout.buildDirectory.dir('desktop-resources')

tasks.register('prepareDesktopResources', Copy) {
    group = 'desktop'
    dependsOn verifyDesktopResources
    from("${repoRoot}/src/main/res/values") {
        include desktopValueXmlFiles
        into 'values'
    }
    from("${repoRoot}/src/main/assets") {
        into 'assets'
    }
    into desktopResourcesDir
}

/** Runnable fat-style jar (classes + copied resources + OGG SPI). */
tasks.register('desktopJar', Jar) {
    group = 'desktop'
    dependsOn compileJava, prepareDesktopResources
    archiveBaseName = 'CFHC-desktop'
    archiveVersion = '1.4e'
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from desktopResourcesDir
    def bundledJars = fileTree("${repoRoot}/libs").matching {
        include 'vorbisspi*.jar'
        include 'jorbis*.jar'
        include 'tritonus-share*.jar'
        include 'flatlaf*.jar'
    }
    bundledJars.each { from(zipTree(it)) }
    from("${repoRoot}") {
        include 'LICENSE'
        include 'SOUND_LICENSES.md'
    }
    manifest {
        attributes(
                'Main-Class': 'desktop.Main',
                'Implementation-Title': 'CFHC Desktop',
                'Implementation-Version': '1.4e',
                'Implementation-Vendor': 'CFHC'
        )
    }
}

tasks.register('runDesktop', JavaExec) {
    group = 'desktop'
    dependsOn compileJava, prepareDesktopResources
    def oggSpiJars = files(fileTree("${repoRoot}/libs").matching {
        include 'vorbisspi*.jar'
        include 'jorbis*.jar'
        include 'tritonus-share*.jar'
    })
    def flatlafJars = files(fileTree("${repoRoot}/libs").matching {
        include 'flatlaf*.jar'
    })
    classpath = sourceSets.main.runtimeClasspath + files(desktopResourcesDir.get().asFile) + oggSpiJars + flatlafJars
    mainClass = 'desktop.Main'
    if (project.hasProperty('desktopArgs')) {
        args project.property('desktopArgs').toString().split(/\s+/).findAll { !it.isEmpty() }
    }
}

tasks.named('jar') {
    enabled = false
}

tasks.named('test', Test) {
    // Tests use System.getProperty("user.dir") / DesktopResourceProvider(projectRoot) — must be repo root.
    workingDir = repoRoot
    // Forward -DregenGoldenSaves=true from the Gradle JVM into test workers.
    systemProperty 'regenGoldenSaves', System.getProperty('regenGoldenSaves', 'false')
    // DesktopAudioManager loads assets/sounds/* from the classpath (same layout as desktopJar).
    dependsOn prepareDesktopResources
    classpath += files(desktopResourcesDir)
}

tasks.register('desktopStandaloneGate') {
    group = 'verification'
    description = 'Compile shared engine, run JVM unit tests, build desktop jar — no Android SDK.'
    dependsOn test, desktopJar
    doLast {
        def jar = tasks.named('desktopJar', Jar).get().archiveFile.get().asFile
        def entries = new java.util.zip.ZipFile(jar).withCloseable { zf ->
            zf.entries().collect { it.name } as Set
        }
        def required = [
                'META-INF/services/javax.sound.sampled.spi.AudioFileReader',
                'javazoom/spi/vorbis/sampled/file/VorbisAudioFileReader.class',
                'com/jcraft/jorbis/VorbisFile.class',
                'org/tritonus/share/sampled/file/TAudioFileReader.class',
                'com/formdev/flatlaf/FlatLightLaf.class',
                'com/formdev/flatlaf/FlatDarkLaf.class',
                'LICENSE',
                'SOUND_LICENSES.md',
                'desktop/Main.class',
                'desktop/DesktopVersion.class',
                'assets/sounds/click.ogg',
        ]
        def missing = required.findAll { !entries.contains(it) }
        if (!missing.isEmpty()) {
            throw new GradleException('desktopJar missing required entries: ' + missing)
        }
    }
}

def desktopPackagingVersion = '1.4e'

def jpackageBinary = {
    def jp = new File(System.getProperty('java.home'), 'bin/jpackage')
    if (jp.exists()) {
        return jp
    }
    def jpExe = new File(System.getProperty('java.home'), 'bin/jpackage.exe')
    return jpExe.exists() ? jpExe : null
}

/**
 * Packaging scaffold for the desktop jar. Requires a JDK with {@code jpackage} (JDK 17+).
 * Not part of {@code desktopStandaloneGate}.
 * Signed macOS/Windows installers remain blocked on certificates.
 *
 * Note: {@code --type app-image} produces a jpackage application *directory*,
 * not a Linux {@code .AppImage} file.
 */
tasks.register('desktopJpackageDryRun') {
    group = 'desktop'
    description = 'Print the intended jpackage command for CFHC-desktop.'
    dependsOn desktopJar
    doLast {
        def jar = tasks.named('desktopJar', Jar).get().archiveFile.get().asFile
        def jpackage = jpackageBinary()
        println 'CFHC desktop packaging:'
        println '  input jar : ' + jar.absolutePath
        println '  main class: desktop.Main'
        println '  version   : ' + desktopPackagingVersion
        println '  suggested :'
        println '    jpackage --name CFHC --app-version ' + desktopPackagingVersion + ' --vendor CFHC' +
                ' --description "College Football Head Coach"' +
                ' --input ' + jar.parentFile.absolutePath +
                ' --main-jar ' + jar.name +
                ' --main-class desktop.Main --type app-image'
        if (jpackage == null) {
            println 'NOTE: jpackage binary not found in JAVA_HOME; install a full JDK 17+ to build installers.'
        } else {
            println 'jpackage available at: ' + jpackage.absolutePath
        }
    }
}

tasks.register('desktopJpackageImage', Exec) {
    group = 'desktop'
    description = 'Build an unsigned jpackage app-image directory (not a .AppImage file).'
    dependsOn desktopJar
    onlyIf { jpackageBinary() != null }
    doFirst {
        def jar = tasks.named('desktopJar', Jar).get().archiveFile.get().asFile
        def outDir = layout.buildDirectory.dir('jpackage').get().asFile
        outDir.mkdirs()
        def existing = new File(outDir, 'CFHC')
        if (existing.exists()) {
            existing.deleteDir()
        }
        executable = jpackageBinary().absolutePath
        args = [
                '--name', 'CFHC',
                '--app-version', desktopPackagingVersion,
                '--vendor', 'CFHC',
                '--description', 'College Football Head Coach',
                '--input', jar.parentFile.absolutePath,
                '--main-jar', jar.name,
                '--main-class', 'desktop.Main',
                '--type', 'app-image',
                '--dest', outDir.absolutePath
        ]
    }
}

/** Back-compat alias — same as {@link #desktopJpackageImage}. */
tasks.register('desktopAppImage') {
    group = 'desktop'
    description = 'Alias for desktopJpackageImage (jpackage app directory, not a .AppImage file).'
    dependsOn desktopJpackageImage
}

tasks.register('desktopPortableZip', Zip) {
    group = 'desktop'
    description = 'Zip the unsigned jpackage app-image directory into a portable archive (bundled runtime).'
    dependsOn desktopJpackageImage
    onlyIf { jpackageBinary() != null }
    archiveBaseName = 'CFHC-desktop-portable'
    archiveVersion = desktopPackagingVersion
    destinationDirectory = layout.buildDirectory.dir('dist')
    from(layout.buildDirectory.dir('jpackage/CFHC'))
    doFirst {
        def appDir = layout.buildDirectory.dir('jpackage/CFHC').get().asFile
        if (!appDir.directory) {
            throw new GradleException(
                    'Missing jpackage app-image at ' + appDir +
                            '. Run :engine:desktopJpackageImage first (requires JDK jpackage).')
        }
    }
}

tasks.register('desktopDmg', Exec) {
    group = 'desktop'
    description = 'Build an unsigned macOS .dmg via jpackage (macOS + jpackage only; unsigned).'
    dependsOn desktopJar
    onlyIf {
        def os = System.getProperty('os.name', '').toLowerCase()
        os.contains('mac') && jpackageBinary() != null
    }
    doFirst {
        def jar = tasks.named('desktopJar', Jar).get().archiveFile.get().asFile
        def outDir = layout.buildDirectory.dir('jpackage').get().asFile
        outDir.mkdirs()
        executable = jpackageBinary().absolutePath
        args = [
                '--name', 'CFHC',
                '--app-version', desktopPackagingVersion,
                '--vendor', 'CFHC',
                '--description', 'College Football Head Coach',
                '--input', jar.parentFile.absolutePath,
                '--main-jar', jar.name,
                '--main-class', 'desktop.Main',
                '--type', 'dmg',
                '--dest', outDir.absolutePath
        ]
    }
}

tasks.register('desktopMsi', Exec) {
    group = 'desktop'
    description = 'Build an unsigned Windows .msi via jpackage (Windows + jpackage only; unsigned).'
    dependsOn desktopJar
    onlyIf {
        def os = System.getProperty('os.name', '').toLowerCase()
        os.contains('win') && jpackageBinary() != null
    }
    doFirst {
        def jar = tasks.named('desktopJar', Jar).get().archiveFile.get().asFile
        def outDir = layout.buildDirectory.dir('jpackage').get().asFile
        outDir.mkdirs()
        executable = jpackageBinary().absolutePath
        args = [
                '--name', 'CFHC',
                '--app-version', desktopPackagingVersion,
                '--vendor', 'CFHC',
                '--description', 'College Football Head Coach',
                '--input', jar.parentFile.absolutePath,
                '--main-jar', jar.name,
                '--main-class', 'desktop.Main',
                '--type', 'msi',
                '--dest', outDir.absolutePath
        ]
    }
}


