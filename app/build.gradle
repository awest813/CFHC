plugins {
    id 'com.android.application'
}

def repoRoot = rootProject.projectDir

// Release signing resolution order: CFHC_* env vars, then a gitignored
// signing.properties at the repo root (see signing.properties.example),
// then the auto-generated debug key as a last resort so the project still
// configures on fresh clones and CI. Packaging a release artifact with the
// debug key fails fast unless -PallowDebugSignedRelease is passed — CI sets
// it because it only exercises the R8/minify config; its release artifacts
// are for smoke tests and must never be distributed.
def signingProps = new Properties()
def signingPropsFile = rootProject.file('signing.properties')
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}
def releaseKeystorePath = System.getenv('CFHC_KEYSTORE') ?: signingProps.getProperty('storeFile')
def releaseKeystoreUsable = releaseKeystorePath != null && !releaseKeystorePath.isEmpty() && file(releaseKeystorePath).exists()
ext.usingDebugSigningForRelease = !releaseKeystoreUsable

android {
    namespace 'antdroid.cfbcoach'
    signingConfigs {
        config {
            if (releaseKeystoreUsable) {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv('CFHC_STORE_PASSWORD') ?: signingProps.getProperty('storePassword') ?: ''
                keyAlias System.getenv('CFHC_KEY_ALIAS') ?: signingProps.getProperty('keyAlias') ?: ''
                keyPassword System.getenv('CFHC_KEY_PASSWORD') ?: signingProps.getProperty('keyPassword') ?: ''
            } else {
                storeFile signingConfigs.debug.storeFile
                storePassword signingConfigs.debug.storePassword
                keyAlias signingConfigs.debug.keyAlias
                keyPassword signingConfigs.debug.keyPassword
            }
        }
    }
    compileSdk 35
    defaultConfig {
        applicationId "antdroid.cfbcoach"
        minSdk 24
        targetSdk 35

        /*
         * Versioning policy:
         *
         *   versionCode — monotonically increasing integer used by Google Play
         *   to compare versions.  Each release (debug, beta, production) must
         *   bump this.  Increment by 1 per stable release; use +1000 for
         *   internal pre-releases if needed.
         *
         *   versionName — human-readable string displayed to users.  Format:
         *     v<major>.<minor>.<patch>[-<pre>]
         *   Examples:
         *     v1.4.5        stable release
         *     v1.5.0-beta1  pre-release beta
         *     v1.5.0-DEBUG  local debug build (appended automatically)
         *
         *   Bump:
         *     patch — bug fixes (backward compatible)
         *     minor — new features (backward compatible)
         *     major — breaking changes or large rewrites
         *
         *   To auto-bump, run:
         *     ./gradlew bumpVersion -Ppatch   # next patch
         *     ./gradlew bumpVersion -Pminor   # next minor
         *     ./gradlew bumpVersion -Pmajor   # next major
         */
        versionName 'v1.4.5'
        versionCode 320
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            signingConfig signingConfigs.config
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    "${repoRoot}/proguard-rules.pro"
        }
        debug {
            versionNameSuffix '-DEBUG'
        }
        beta {
            debuggable true
            versionNameSuffix '-BETA'
        }
    }
    productFlavors {
    }
    buildFeatures {
        // Typed view access for new/redesigned screens (Wave 0 of the Android
        // UI redesign; migrated per-screen, existing findViewById stays until
        // each screen is touched).
        viewBinding true
    }
    sourceSets {
        main {
            java {
                srcDirs = ["${repoRoot}/src/main/java"]
                exclude 'simulation/**'
                exclude 'positions/**'
                exclude 'staff/**'
                exclude 'comparator/**'
                exclude 'recruiting/**'
                exclude 'desktop/**'
            }
            res.srcDirs = ["${repoRoot}/src/main/res"]
            assets.srcDirs = ["${repoRoot}/src/main/assets"]
            manifest.srcFile "${repoRoot}/src/main/AndroidManifest.xml"
        }
        test {
            java {
                srcDirs = ["${repoRoot}/src/test/java"]
                // Desktop Swing tests belong to desktop-standalone / root desktopJar — not Android.
                exclude 'desktop/**'
            }
        }
    }
    applicationVariants.all { variant ->
        variant.resValue "string", "versionName", variant.versionName
    }
}

dependencies {
    implementation project(':engine')
    // Desktop-only jars live in libs/ (FlatLaf, OGG SPI) — never ship them in the APK.
    implementation fileTree(dir: "${repoRoot}/libs", include: ['*.jar'], exclude: [
            'flatlaf*.jar',
            'vorbisspi*.jar',
            'jorbis*.jar',
            'tritonus-share*.jar',
    ])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.1.1'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'com.jjoe64:graphview:4.2.2'
    testImplementation 'junit:junit:4.13.2'
}

// Refuse to package a distribution release signed with the debug key. CI passes
// -PallowDebugSignedRelease because it only exercises the R8/minify pipeline.
gradle.taskGraph.whenReady { graph ->
    def packagingRelease = graph.allTasks.any { it.name == 'assembleRelease' || it.name == 'bundleRelease' }
    if (packagingRelease && ext.usingDebugSigningForRelease && !project.hasProperty('allowDebugSignedRelease')) {
        throw new GradleException(
            "Refusing to build a release artifact signed with the debug key.\n" +
            "Provide signing via CFHC_KEYSTORE / CFHC_STORE_PASSWORD / CFHC_KEY_ALIAS /\n" +
            "CFHC_KEY_PASSWORD env vars, or a gitignored signing.properties at the repo\n" +
            "root (see signing.properties.example). To intentionally build a\n" +
            "debug-signed release (CI config check only), pass -PallowDebugSignedRelease.")
    }
}

tasks.withType(Test).configureEach {
    workingDir = repoRoot
    filter {
        // Long-running suites: opt in with -PrunStress for release-gate runs.
        if (!project.hasProperty('runStress')) {
            excludeTestsMatching '*Stress100SeasonsTest*'
            excludeTestsMatching '*Debug20SeasonsFlowTest*'
        }
    }
}
