plugins {
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    // Engine tests (src/test/java simulation/positions/staff/comparator/recruiting)
    // are executed by :app:test and by :engine:test in desktop-standalone —
    // this project declares no test source set, so no junit dependency here.
}

def sharedJavaRoot = rootProject.file('src/main/java')

sourceSets {
    main {
        java {
            srcDirs = [sharedJavaRoot]
            include 'simulation/**'
            include 'positions/**'
            include 'staff/**'
            include 'comparator/**'
            include 'recruiting/**'
        }
    }
}

// Sources and test fixtures contain UTF-8 (·, —, ✓). Do not depend on the
// build machine's locale: on a POSIX/ASCII locale javac mangled them and
// string-comparison tests failed.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.withType(Test).configureEach {
    systemProperty 'file.encoding', 'UTF-8'
}
